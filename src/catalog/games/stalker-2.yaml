id: stalker-2
name: "S.T.A.L.K.E.R. 2: Heart of Chornobyl"
steamAppId: "1643320"
executable: Stalker2/Binaries/Win64/Stalker2-Win64-Shipping.exe
enginePreset: unreal5
pcgwSlug: "S.T.A.L.K.E.R. 2: Heart of Chornobyl"
modules:
  - id: desktop-shortcut
    name: Criar atalho na Área de Trabalho
    description: Criar um atalho do Windows para STALKER 2 usando o executável catalogado como destino e ícone.
    category: system
    status: available
  - id: obs-vr
    name: Captura OBS VR
    description: Criar ou atualizar a captura Game Capture da sessão UEVR com backup automático e rollback.
    category: vr
    status: available
    config:
      collectionName: Sem nome
      sceneName: vr
      sourceName: STALKER 2 VR
      executableName: Stalker2-Win64-Shipping.exe
  - id: ofxr-bridge
    name: OFXR Bridge FrameGen
    description: Install the OFXR Bridge tray tool, apply the recommended optical-flow settings, and arm it before launching the VR game.
    category: vr
    status: available
    config:
      version: 0.2.1
      downloadUrl: https://github.com/tig3rmast3r/OFXR-Bridge/releases/download/0.2.1/OFXR-Bridge-v0.2.1-V116.zip
      updateUrl: https://api.github.com/repos/tig3rmast3r/OFXR-Bridge/releases/latest
      sha256: db224491cbc9553a51fe55d08623d25864c4ec0a3d49bd76e9d6c4d9b2410c67
      implementationVersion: 116
      backend: fidelityfx
      nvidiaPreset: medium
      nvidiaInputScale: 50
  - id: uevr
    name: Instalador UEVR com detecção de engine
    description: Detectar Unreal Engine, resolver a release oficial do UEVR e manter variantes Nightly, JoeyHodge e AFW separadas e reversíveis.
    category: vr
    status: available
    config:
      versionPolicy: latest
      releaseApiUrl: https://api.github.com/repos/praydog/UEVR-nightly/releases/latest
      afwReleaseApiUrl: https://api.github.com/repos/PureDark/UEVR/releases/latest
      backendReleaseApiUrl: https://api.github.com/repos/joeyhodge/UEVR/releases/latest
      defaultBackend: nightly
      backendCandidates:
        - nightly|available
        - joey|available
        - afw|experimental
        - joey-afw|experimental
      safetyNotes:
        - O scanner local confirmou um perfil UEVR e o caminho Native Stereo deve ser validado primeiro dentro do jogo.
        - Feche STALKER 2 e UEVRInjector.exe antes de instalar ou trocar uma variante.
        - Não execute Steam, UEVR ou o jogo como administrador.
# `cheeky-foveated-dlss-uevr` foi listado aqui e removido. É quase
# duplicata do módulo `cheeky-foveated-dlss` que o preset unreal5 já
# adiciona, sob um id que nada implementa. Como entrada `planned` virava
# um card desabilitado, não um botão quebrado — mas o catálogo anunciava um
# id sobre o qual o app não pode agir. Volta quando o fluxo transacional
# específico do jogo que ele descreve existir de fato.
  - id: optiscaler
    name: OptiScaler
    description: Instalar a release oficial do OptiScaler com verificação de checksum, seleção de proxy consciente de conflito e rollback. Compatível com STALKER 2 segundo a lista oficial do projeto.
    category: graphics
    status: available
    config:
      version: 0.9.4
      downloadUrl: https://github.com/optiscaler/OptiScaler/releases/download/v0.9.4/Optiscaler_0.9.4-final.20260718._MM.7z
      updateUrl: https://api.github.com/repos/optiscaler/OptiScaler/releases/latest
      sha256: 575cb4df866116093df75af607e37fd70e10f5163e0f23fd5c804142e80ef0ad
      proxy: dxgi.dll
      proxyCandidates: dxgi.dll,wininet.dll
      compatibilityStatus: proven
      compatSource: 'https://github.com/optiscaler/OptiScaler/wiki/S.T.A.L.K.E.R.-2-Heart-of-Chornobyl'
      recommendedUpscaler: dlss
      safetyNotes:
        - OptiScaler 0.9+ está marcado como compatível com STALKER 2 na lista oficial do projeto.
        - Prefira entrada DLSS ou XeSS — entradas FSR 3.1 apresentam image quality ruim segundo o autor do OptiScaler.
        - Em sessões UEVR, use OptiScaler junto com o build AFW se você tem GPU AMD; em NVIDIA o DLSS nativo do jogo já funciona.
        - Não combine OptiScaler com injetores DLSS Frame Gen ao mesmo tempo — escolha um upscaler ou um frame gen, não os dois.
  - id: reshade
    name: ReShade host
    description: Instalar uma build do ReShade compatível com o jogo, com seleção de proxy-DLL e rollback transacional. Em STALKER 2 VR (UEVR) o ReShade tende a conflitar com o injetor — trate como arriscado.
    category: graphics
    status: planned
    config:
      compatibilityStatus: risky
      safetyNotes:
        - ReShade não roda de forma estável com UEVR em STALKER 2 — a própria documentação do UEVR recomenda remover ReShade ao diagnosticar problemas de VR.
        - Caso queira testar, faça em uma sessão limpa (sem outros overlays) e tenha o plano de desinstalar pelo Moddin se o jogo travar.
        - ReShade continua sendo requisito do add-on Cheeky no caminho não-VR.
