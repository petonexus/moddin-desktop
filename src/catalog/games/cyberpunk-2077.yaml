id: cyberpunk-2077
name: Cyberpunk 2077
steamAppId: "1091500"
executable: bin/x64/Cyberpunk2077.exe
modules:
  - id: vr-launch
    name: VR launch profile
    description: Validate the Cyberpunk VR Port installation, use the active OpenXR runtime, and start the game with a conservative graphics profile.
    category: vr
    status: available
    config:
      runtime: openxr
      updateUrl: https://api.github.com/repos/dariulone/cyberpunk-vr-port/releases/latest
      arguments:
        - -borderless
      requiredFiles:
        - red4ext/plugins/CyberpunkVR_Stereo/CyberpunkVR_Stereo.dll
      recommendations:
        - Graphics preset=Low
        - Film grain=Off
        - Chromatic aberration=Off
        - Motion blur=Off
        - Lens flare=Off
        - Depth of field=Off
        - Frame generation=Off
        - Display mode=Borderless
        - VR runtime=OpenXR (start it before the game)
      safetyNotes:
        - The Cyberpunk VR Port applies its tuned UserSettings profile on its first launch and backs up the player's file; Moddin does not overwrite that file.
        - Disable OpenXR Toolkit, RivaTuner and GPU overlays before starting the VR Port.
  - id: obs-vr
    name: OBS VR Capture
    description: Create or update a dedicated OBS Game Capture source for the VR scene with automatic backup and rollback.
    category: vr
    status: available
    config:
      collectionName: Sem nome
      sceneName: vr
      sourceName: Cyberpunk 2077 VR
      executableName: Cyberpunk2077.exe
  - id: optiscaler
    name: OptiScaler
    description: Install the official OptiScaler release with checksum verification, conflict-aware proxy selection and rollback.
    category: graphics
    status: available
    config:
      version: 0.9.4
      downloadUrl: https://github.com/optiscaler/OptiScaler/releases/download/v0.9.4/Optiscaler_0.9.4-final.20260718._MM.7z
      updateUrl: https://api.github.com/repos/optiscaler/OptiScaler/releases/latest
      sha256: 575cb4df866116093df75af607e37fd70e10f5163e0f23fd5c804142e80ef0ad
      proxyCandidates: dxgi.dll,wininet.dll
  - id: cheeky-foveated-dlss
    name: Cheeky Foveated DLSS
    description: Install the ReShade add-on that concentrates DLSS quality in the center of the image for lower GPU cost.
    category: graphics
    status: available
    config:
      version: 0.3.4
      downloadUrl: https://github.com/ClarkCheekyKent/CheekyFoveatedDLSS/releases/download/v0.3.4/CheekyFoveatedDLSS.addon64
      updateUrl: https://api.github.com/repos/ClarkCheekyKent/CheekyFoveatedDLSS/releases/latest
      sha256: ad959b083b261172168c908791438cbb21eb183572ee50ec77de278580720df3
      addonFile: CheekyFoveatedDLSS.addon64
      compatibilityStatus: experimental
      compatibilityEvidence: upstream-not-confirmed
  - id: ofxr-framegen
    name: OFXR FrameGen
    description: Install the OFXR Bridge tray tool, apply the recommended optical-flow settings, and arm it before launching the VR game.
    category: vr
    status: available
    config:
      version: 0.2.0
      implementationVersion: 68
      downloadUrl: https://github.com/tig3rmast3r/OFXR-Bridge/releases/download/0.2.0/OFXR-Bridge-v0.2.0-V068.zip
      updateUrl: https://api.github.com/repos/tig3rmast3r/OFXR-Bridge/releases?per_page=1
      sha256: 3a4db67abd3d7fd013c9ef6878d8b7e23d312e84fe9c2c39ae509e4e554cb7f4
      backend: fidelityfx
      nvidiaPreset: medium
      nvidiaInputScale: 50
      nvidiaBidirectional: 0
      safetyNotes:
        - OFXR Bridge is an experimental pre-release; it may produce artifacts, freeze, or crash depending on the game, VR mod, GPU, and runtime.
        - The tray requires the Microsoft Visual C++ Redistributable x64. Keep the game non-elevated because OpenXR ignores per-user layers for elevated processes.
  - id: openxr
    name: OpenXR tools
    description: Manage OpenXR-related helpers and per-game VR configuration.
    category: vr
    status: planned
  - id: uevr
    name: UEVR engine-aware installer
    description: Detect the game engine, resolve the newest compatible UEVR build, and keep Nightly, JoeyHodge, and AFW variants separate and reversible.
    category: vr
    status: available
    config:
      versionPolicy: latest
      releaseApiUrl: https://api.github.com/repos/praydog/UEVR-nightly/releases/latest
      afwReleaseApiUrl: https://api.github.com/repos/PureDark/UEVR/releases/latest
      backendReleaseApiUrl: https://api.github.com/repos/joeyhodge/UEVR/releases/latest
      defaultBackend: nightly
      backendCandidates:
        - nightly|available
        - joey|available
        - afw|experimental
        - joey-afw|experimental
      safetyNotes:
        - UEVR is only eligible for Unreal Engine games in the supported UE 4.8-5.4 range; the local engine detection is a gate, not a compatibility guarantee.
        - Nightly is verified with the upstream SHA-256 sidecar. JoeyHodge and AFW releases are official GitHub sources but may not publish a checksum sidecar.
        - Close the game and UEVRInjector.exe before installing or changing a backend. Do not run UEVR, Steam, or the game as administrator.
