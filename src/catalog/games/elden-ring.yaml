id: elden-ring
name: Elden Ring
steamAppId: "1245620"
executable: Game/eldenring.exe
modules:
  - id: vr-launch
    name: VR launch profile
    description: Validate ERVR, apply the recommended full-stereo performance settings with backup, and start Elden Ring through OpenXR.
    category: vr
    status: available
    config:
      runtime: openxr
      requiredFiles:
        - Game/ERVR/ERVR.dll
      configPath: Game/ERVR/ERVR.ini
      configPatches:
        - VR|StereoMode|full
        - VR|GameRes|auto
        - VR|GameResScale|0.75
        - VR|RenderScale|1.0
        - Patches|FpsTarget|60
      recommendations:
        - Stereo mode=full
        - Game resolution=auto
        - Game resolution scale=0.75
        - OpenXR render scale=1.0
        - FPS target=60
        - Steam=Offline mode
        - Easy Anti-Cheat=Disabled by the existing offline mod setup
      safetyNotes:
        - ERVR does not disable Easy Anti-Cheat. Moddin will not bypass EAC; use the existing offline launch method and never load an online character with the mod active.
        - Start SteamVR, Meta Quest Link, Virtual Desktop VDXR, or another OpenXR runtime before launching.
  - id: obs-vr
    name: OBS VR Capture
    description: Create or update a dedicated OBS Game Capture source for the VR scene with automatic backup and rollback.
    category: vr
    status: available
    config:
      collectionName: Sem nome
      sceneName: vr
      sourceName: Elden Ring VR
      executableName: eldenring.exe
  - id: optiscaler
    name: OptiScaler
    description: Install the official OptiScaler release with checksum verification, conflict-aware proxy selection and rollback.
    category: graphics
    status: available
    config:
      version: 0.9.4
      downloadUrl: https://github.com/optiscaler/OptiScaler/releases/download/v0.9.4/Optiscaler_0.9.4-final.20260718._MM.7z
      updateUrl: https://api.github.com/repos/optiscaler/OptiScaler/releases/latest
      sha256: 575cb4df866116093df75af607e37fd70e10f5163e0f23fd5c804142e80ef0ad
      proxyCandidates: dxgi.dll,version.dll
  - id: openxr
    name: OpenXR tools
    description: Manage OpenXR-related helpers and per-game VR configuration.
    category: vr
    status: planned
