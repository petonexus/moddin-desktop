name: Release

# Publishes a GitHub release when a version tag is pushed.
#
# The installer is BUILT here, on windows-latest, and the SHA-256 of
# whatever came out is written back into the release body. That is the
# whole point: the release notes already tell users to check a digest,
# and a digest computed by hand on a maintainer's laptop is not
# evidence of anything. Every installer in this release's history was
# built outside CI.
#
# The body comes from `docs/release-notes/.release-notes-<tag>.md`; its
# first line (a Markdown H1) becomes the release title. Tags with a
# pre-release suffix (e.g. v0.1.0-beta.2) publish as pre-releases.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to validate (no publication)
        required: true
        default: v0.1.0-beta.6

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    outputs:
      installer: ${{ steps.package.outputs.installer }}
      sha256: ${{ steps.package.outputs.sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release version and bundled features
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node scripts/check-bundle-features.mjs
          node scripts/release-artifacts.mjs check "$env:RELEASE_TAG"

      - name: Install frontend dependencies
        run: npm ci

      - name: Check and build frontend
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = 'Stop'
          npm run check:architecture
          npm run check:catalog
          node --test scripts/release-artifacts.test.mjs
          npm test
          npm run build

      - name: Setup Rust toolchain
        shell: pwsh
        # Same override ci.yml uses: rust-toolchain.toml at the repo root
        # pins the release, so a tagged build cannot be produced by a
        # different compiler than the one CI verified.
        run: |
          rustup show
          rustc --version
          cargo --version

      # tauri.conf.json bundles ../moddin-runtime/{node.exe,moddin-agent},
      # and tauri-build validates those resource paths during cargo's
      # build script, so the Tauri build fails without them. The script
      # downloads a digest-verified portable Node and stages the
      # production agent runtime.
      - name: Bundle moddin-runtime
        shell: pwsh
        run: pwsh -NoProfile -File ./moddin-runtime/bundle-runtime.ps1

      - name: Build signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'TAURI_SIGNING_PRIVATE_KEY is required; see docs/UPDATER.md.' }
          npm run tauri build -- --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'Tauri installer build failed.' }

      # Tauri v2 signs the setup executable. The CLI does not generate
      # latest.json; derive it from this exact executable and signature.
      - name: Generate updater manifest
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: node scripts/release-artifacts.mjs manifest "$env:RELEASE_TAG" "$env:RELEASE_REPOSITORY"

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moddin-updater
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error
          retention-days: 7

      # Pin the exact artifact and its digest so the release job uploads
      # what it hashed, with no glob left to match something else.
      - name: Collect and hash the installer
        id: package
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path 'src-tauri\target\release\bundle\nsis' -Filter '*-setup.exe' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw 'No NSIS installer was produced at src-tauri\target\release\bundle\nsis\'
          }
          $digest = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "installer: $($installer.Name)"
          Write-Host "sha256:    $digest"
          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "sha256=$digest" >> $env:GITHUB_OUTPUT
          Add-Content -Path "$env:GITHUB_STEP_SUMMARY" -Value "| file | sha256 |`n| --- | --- |`n| $($installer.Name) | ``$digest`` |"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: moddin-installer
          path: ${{ steps.package.outputs.installer }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: moddin-installer

      # The updater payload is always present now — the build step above
      # throws without it — so this download is unconditional. The `if:`
      # would only hide a real failure.
      - name: Download updater payload
        uses: actions/download-artifact@v4
        with:
          name: moddin-updater

      - name: Create release from notes file
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          notes="docs/release-notes/.release-notes-${TAG}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Missing $notes. Commit the release notes before pushing the tag."
            exit 1
          fi

          title="$(head -n 1 "$notes" | sed 's/^# *//')"
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac

          # Append the CI-computed digest so the notes and the artifact
          # can never disagree about what was published.
          printf '\n---\n\nBuilt by CI on windows-latest. SHA-256 of the installer:\n\n```\n%s\n```\n' "$SHA256" >> "$notes"

          # Missing signed artifacts fail closed. workflow_dispatch only
          # builds/uploads artifacts and never reaches this publishing job.
          test -s ./latest.json
          compgen -G './*-setup.exe.sig' > /dev/null

          gh release create "$TAG" \
            --verify-tag \
            --title "$title" \
            --notes-file "$notes" \
            ./*.exe \
            ./latest.json ./*-setup.exe.sig \
            "${prerelease[@]}"
