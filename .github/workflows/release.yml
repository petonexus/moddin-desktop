name: Release

# Publishes a GitHub release when a version tag is pushed.
#
# The installer is BUILT here, on windows-latest, and the SHA-256 of
# whatever came out is written back into the release body. That is the
# whole point: the release notes already tell users to check a digest,
# and a digest computed by hand on a maintainer's laptop is not
# evidence of anything. Every installer in this release's history was
# built outside CI.
#
# The body comes from `.release-notes-<tag>.md` at the repo root; its
# first line (a Markdown H1) becomes the release title. Tags with a
# pre-release suffix (e.g. v0.1.0-beta.2) publish as pre-releases.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    outputs:
      installer: ${{ steps.package.outputs.installer }}
      sha256: ${{ steps.package.outputs.sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check and build frontend
        run: |
          npm run check:architecture
          npm run build

      - name: Setup Rust stable MSVC
        shell: pwsh
        run: |
          rustup default stable-msvc
          rustc --version
          cargo --version

      # tauri.conf.json bundles ../moddin-runtime/{node.exe,moddin-agent},
      # and tauri-build validates those resource paths during cargo's
      # build script, so the Tauri build fails without them. The script
      # downloads a digest-verified portable Node and stages the
      # production agent runtime.
      - name: Bundle moddin-runtime
        shell: pwsh
        run: pwsh -NoProfile -File ./moddin-runtime/bundle-runtime.ps1

      - name: Build installer
        run: npm run tauri build -- --bundles nsis

      # Pin the exact artifact and its digest so the release job uploads
      # what it hashed, with no glob left to match something else.
      - name: Collect and hash the installer
        id: package
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path 'src-tauri\target\release\bundle\nsis' -Filter '*-setup.exe' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw 'No NSIS installer was produced at src-tauri\target\release\bundle\nsis\'
          }
          $digest = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "installer: $($installer.Name)"
          Write-Host "sha256:    $digest"
          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "sha256=$digest" >> $env:GITHUB_OUTPUT
          Add-Content -Path "$env:GITHUB_STEP_SUMMARY" -Value "| file | sha256 |`n| --- | --- |`n| $($installer.Name) | ``$digest`` |"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: moddin-installer
          path: ${{ steps.package.outputs.installer }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: moddin-installer

      - name: Create release from notes file
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          notes=".release-notes-${TAG}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Missing $notes. Commit the release notes before pushing the tag."
            exit 1
          fi

          title="$(head -n 1 "$notes" | sed 's/^# *//')"
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac

          # Append the CI-computed digest so the notes and the artifact
          # can never disagree about what was published.
          printf '\n---\n\nBuilt by CI on windows-latest. SHA-256 of the installer:\n\n```\n%s\n```\n' "$SHA256" >> "$notes"

          gh release create "$TAG" \
            --verify-tag \
            --title "$title" \
            --notes-file "$notes" \
            ./*.exe \
            "${prerelease[@]}"
