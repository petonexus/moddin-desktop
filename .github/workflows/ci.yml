name: CI

on:
  push:
    branches: [main, 'feat/**', 'refactor/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build & tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check and build frontend
        run: |
          npm run check:architecture
          npm run build

      - name: Validate moddin-agent capability templates
        working-directory: moddin-agent
        run: |
          npm ci
          node scripts/validate-templates.mjs

      - name: Smoke test moddin-agent MCP server
        working-directory: moddin-agent
        run: node scripts/smoke-test.mjs

      - name: Setup Rust stable MSVC
        shell: pwsh
        run: |
          rustup default stable-msvc
          rustc --version
          cargo --version

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
