id: ofxr-bridge
displayName: OFXR Bridge FrameGen
description: Streams the flat desktop into a VR headset through OpenXR, so non-VR games work in VR.
category: vr
status: available
supportedEngines:
  - unreal5
  - redengine
  - re-engine
configSchema:
  - name: downloadUrl
    type: url
    required: true
    description: HTTPS URL of the OFXR-Bridge archive (zip).
  - name: sha256
    type: sha256
    required: true
    description: Expected SHA-256 of the archive.
  - name: version
    type: string
    required: true
    description: Upstream release tag.
  - name: implementationVersion
    type: number
    required: true
    description: OFXR-Bridge internal implementation version.
  - name: backend
    type: enum
    enumValues: [fidelityfx, nvidia]
    required: true
    description: Optical-flow backend.
  - name: nvidiaPreset
    type: enum
    enumValues: [fast, medium, slow]
    default: medium
    description: NVIDIA preset when backend is nvidia.
  - name: nvidiaInputScale
    type: number
    enumValues: [50, 75, 100]
    default: 50
    description: NVIDIA input scale percentage.
  - name: runtimePath
    type: path
    required: true
    description: Absolute path of the OFXR RuntimeLayer manifest written to the OpenXR ApiLayers registry key.
  - name: trayExe
    type: path
    required: true
    description: Absolute path of the OFXRBridgeTray.exe spawned to surface the layer.
  - name: trayIniPath
    type: path
    required: true
    description: Absolute path of the tray.ini written with the configured preset.
  - name: extractedDir
    type: path
    required: true
    description: Absolute path of the staging directory the archive is extracted into before the runtime manifest is promoted out of it.
checks:
  - id: archive-reachable
    label: OFXR archive reachable
    kind: archive-reachable
    severity: warning
    category: modulespecific
    description: Confirms the configured download URL responds before any install step runs.
    params:
      urlField: downloadUrl
  - id: archive-sha256
    label: Archive SHA-256 matches recipe
    kind: archive-sha256
    severity: blocker
    category: modulespecific
    description: Compares the downloaded archive against the declared digest.
    params:
      urlField: downloadUrl
      expectedField: sha256
  - id: tray-running
    label: OFXRBridgeTray.exe is running
    kind: process-running
    severity: warning
    category: modulespecific
    description: OFXR Bridge cannot apply frame generation unless the tray is alive.
    params:
      processName: OFXRBridgeTray.exe
install:
  - kind: download-file
    description: Download the OFXR-Bridge archive into Moddin's cache.
    params:
      urlField: downloadUrl
      target: ofxr-bridge.zip
  - kind: extract-zip
    description: Extract OFXR-Bridge archive into the staging directory.
    params:
      archivePath: ofxr-bridge.zip
      targetSubdirField: extractedDir
  - kind: move-file
    description: Promote the staged runtime manifest into the OpenXR ApiLayers directory the runtime looks in.
    params:
      from: '{extractedDir}/XR_APILAYER_XRFrameBridge_manual-{implementationVersion}.json'
      toField: runtimePath
  - kind: write-text-file
    description: Render and write tray.ini with the configured backend / preset.
    params:
      pathField: trayIniPath
      template: |
        [tray]
        backend={backend}
        nvidia_preset={nvidiaPreset}
        nvidia_input_scale={nvidiaInputScale}
        diagnostics=0
        overlay_position=upper_right
  - kind: spawn-process
    description: Launch the OFXR Bridge tray so the user can arm the layer from the system tray.
    params:
      executableField: trayExe

verify:
  - id: tray-running
    label: OFXRBridgeTray.exe is running
    kind: process-running
    severity: warning
    category: modulespecific
    params:
      processName: OFXRBridgeTray.exe

uninstall:
  - kind: kill-process
    description: Stop OFXRBridgeTray.exe before removing files.
    params:
      processName: OFXRBridgeTray.exe
      force: false
  - kind: file-delete
    description: Remove the local tray.ini written by install.
    params:
      pathField: trayIniPath

safetyNotes:
  - Every path in this chain comes from a `path`-typed config field, so the staging directory, the runtime manifest and the tray all live outside the game folder by design. The transaction store refuses to back any of them up, so the runner reports each one as not covered by Undo; an install that fails part-way leaves the staged archive and the promoted manifest on disk. Deleting `extractedDir` is safe at any time — it is re-extracted on the next install.
  - The promoted manifest is a single file named after the implementation version. If the archive stops shipping that name the move fails with "could not move" rather than silently installing nothing; that is the intended failure, not a bug to work around by pointing `runtimePath` somewhere else.
  - A `move-file` directory move refuses a destination that already exists, so re-installing over an existing ApiLayers entry stops and says so instead of replacing a directory Undo could not restore. Removing the previous manifest first is the supported way to reinstall.
  - OFXR Bridge is an experimental pre-release; it may produce artifacts, freezes, or crashes depending on the game, VR mod, GPU and runtime.
  - The tray requires the Microsoft Visual C++ Redistributable x64; keep the game non-elevated because Windows OpenXR does not apply per-user layers to elevated processes.
  - Requires the Game executable to be closed before install.