id: optiscaler
displayName: OptiScaler DLSS upscaler
description: Adds DLSS Super Resolution to games that ship FSR instead, or no upscaler at all.
category: graphics
status: available
supportedEngines:
  - unreal5
  - redengine
  - re-engine
  - unity
configSchema:
  - name: downloadUrl
    type: url
    required: true
    description: HTTPS URL of the OptiScaler release archive. Upstream publishes one `.7z` asset and no zip; `extract-zip` reads the container from the bytes, so the local staging name below is only a cache key.
  - name: sha256
    type: sha256
    required: true
    description: Expected SHA-256 of the archive.
  - name: version
    type: string
    required: true
    description: Upstream OptiScaler release tag.
  - name: proxy
    type: path
    required: true
    description: Filename OptiScaler's own OptiScaler.dll is installed under in the game directory (dxgi.dll, version.dll, wininet.dll). Moddin never picks this for the user; the catalogue stores the choice, and the install refuses to run if that name is already taken by another mod.
  - name: proxyCandidates
    type: enum
    enumValues: [dxgi.dll, version.dll, d3d11.dll, d3d12.dll, winmm.dll, dinput8.dll, xinput1_3.dll, dbghelp.dll, wininet.dll, winhttp.dll]
    required: true
    description: The proxy names OptiScaler accepts, covering its own setup_windows.bat (dxgi, winmm, d3d12, dbghelp, version, wininet, winhttp) plus the three ReShade-era names. A game picks the one Moddin will install under.
checks:
  - id: archive-reachable
    label: OptiScaler archive reachable
    kind: archive-reachable
    severity: warning
    category: modulespecific
    description: Confirms the configured download URL responds before any install step runs.
    params:
      urlField: downloadUrl
  - id: archive-sha256
    label: Archive SHA-256 matches recipe
    kind: archive-sha256
    severity: blocker
    category: modulespecific
    description: Compares the downloaded archive against the declared digest.
    params:
      urlField: downloadUrl
      expectedField: sha256
install:
  - kind: download-file
    description: Fetch the pinned OptiScaler archive into Moddin's download cache, verifying its digest before anything touches the game folder.
    params:
      urlField: downloadUrl
      expectedField: sha256
      target: optiscaler.7z
  - kind: extract-zip
    description: Extract the OptiScaler archive into the game executable directory. The archive is a 7z; the step reads the container from the bytes, not from the staging name. The payload named below is renamed to the game-chosen `proxy` on the way out, so it cannot collide with another mod that already owns that name.
    params:
      archivePath: optiscaler.7z
      proxyField: proxy
      payload: OptiScaler.dll
safetyNotes:
  - OptiScaler proxies its own DLL into the executable directory; choose a proxy name that does not clash with other mods (UEVR, ReShade, R.E.A.L. VR, ERVR).
  - OptiScaler only ships replacements for DLSS-SR; games that already include DLSS or FSR need their native runtime left untouched.