id: openxr-helpers
displayName: OpenXR runtime helpers
description: Planned. Bind the OpenXR runtime you pick to this game only, so no other title is affected. The OpenXR loader has no per-game registry key, and the two mechanisms that could carry this choice are both outside what a step can express today.
category: vr
status: planned
supportedEngines:
  - unreal5
  - redengine
  - re-engine
configSchema:
  - name: gameExecutable
    type: string
    required: true
    description: File name of the game's own executable, e.g. Cyberpunk2077.exe. Recorded for the per-game override, which is keyed on the executable and not on the Moddin game id.
  - name: preferredRuntime
    type: path
    required: true
    description: Absolute path of the OpenXR runtime manifest (the json a runtime ships) to bind for this game. This is the value an OpenXR runtime binds as ActiveRuntime, the same payload the Windows-global runtime uses.
install: []
uninstall: []
safetyNotes:
  - This recipe is planned, not available, because the effect it describes has no mechanism. The OpenXR loader binds the active runtime from one machine-level value, HKEY_LOCAL_MACHINE\SOFTWARE\Khronos\OpenXR\<major_api_version>, value name ActiveRuntime, REG_SZ holding the manifest path. The loader specification states that "the selection of the active runtime is handled external to the loader", and it defines no per-game or per-executable key under that base. A registry-write here would create a key no loader reads, which is why the install block is empty rather than populated.
  - Reference for the above is the loader specification, sections "Windows Manifest Registry Usage" and "Windows Active Runtime Location" (registry.khronos.org/OpenXR/specs/1.1/loader.html; mirrored in KhronosGroup/OpenXR-SDK-Source, specification/loader/runtime.adoc). Verified 2026-09-29. The only other registry location the specification defines is AvailableRuntimes, whose DWORD *names* are manifest paths and whose data enables or disables an already-discovered runtime; it is not a per-game binding either.
  - The two mechanisms that really do scope a runtime to one game are both out of a step's reach today. The per-process one is the XR_RUNTIME_JSON environment variable, which Moddin already sets for the games it launches, from the VR system panel. The persistent one is a JSON file at %LOCALAPPDATA%\Moddin\profiles\openxr\<gameId>.json, read by openxr::read_game_preference and written by openxr::preference_path.
  - Closing this recipe is therefore a runner gap, not another step kind. A step would need to expand environment variables to reach the profiles directory, and write-text-file would need JSON string escaping before a Windows path could be embedded in the preference document. Rendered unescaped, the preference document is invalid JSON and read_game_preference returns None, which is the same silent failure as a step that cannot set the override at all.
  - The install and uninstall blocks are empty on purpose. run_uninstall resolves no config, so no templated or *Field param can resolve in an uninstall step, and a registry-only install plans no file targets, so it records no transaction for Undo to find. A registry-delete naming a templated key would be a step that cannot succeed, so it is not declared.
