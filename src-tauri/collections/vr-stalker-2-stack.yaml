# Curated bundle: S.T.A.L.K.E.R. 2 in VR.
#
# Same two recipes as the Cyberpunk bundle, on the other engine: both
# declare `unreal5`, the engine `src/catalog/games/stalker-2.yaml`
# declares. `requiredEngines` is load-time validation, not documentation —
# a member that does not declare one of the engines the collection claims
# is refused by `src-tauri/src/collection.rs` before the panel can offer
# the set.
id: vr-stalker-2-stack
displayName: S.T.A.L.K.E.R. 2 VR performance stack
description: >-
  DLSS Super Resolution through OptiScaler, for playing S.T.A.L.K.E.R. 2 in
  VR at a resolution the headset can hold. Close the game before applying —
  the recipe writes into the game folder, and a running game holds the file
  the runner needs to replace.
category: vr
status: available
targetGame: stalker-2
requiredEngines:
  - unreal5
# Three authoring decisions worth keeping in the file rather than in a doc
# nobody reads:
#
# 1. UEVR is deliberately absent. The `uevr` recipe is `status: planned`,
#    and a planned recipe refuses to install with a message instead of
#    reporting success while writing nothing — a collection naming it would
#    advertise a member the runner turns down. This is the mistake the
#    `feat/agent-mcp` branch's own collections made.
# 2. OFXR Bridge is deliberately absent for the same reason, and more
#    recently. Its chain promoted a runtime manifest that no published
#    release ships; the tray generates and registers that manifest itself at
#    arm time, an interactive step a capability chain cannot express. It was
#    a member of this bundle until the recipe went `planned`.
# 3. OptiScaler ships a frame-generation mode of its own, so with OFXR
#    Bridge gone there is no second frame generator here to conflict with
#    it.
#
# The S.T.A.L.K.E.R. 2 catalogue entry marks this OptiScaler release
# `compatibilityStatus: proven` and pins the upstream official build; keep
# that version unless another one has been tested.
capabilities:
  - id: optiscaler
    required: true
    note: >-
      DLSS Super Resolution, from the official OptiScaler build the
      S.T.A.L.K.E.R. 2 catalogue entry pins and marks proven.
