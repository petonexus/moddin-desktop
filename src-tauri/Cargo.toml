[package]
name = "moddin"
version = "0.1.0"
description = "Windows-first PC game mod and tooling manager"
authors = ["Marco Antonio da Silva Junior"]
edition = "2021"
license = "GPL-3.0"

[lib]
name = "moddin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }
