[package]
name = "moddin-desktop"
version = "0.1.0"
description = "Moddin Desktop — Windows-first PC game mod and tooling manager"
authors = ["Marco Antonio da Silva Junior"]
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/petonexus/moddin-desktop"

[lib]
name = "moddin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
pem = "3"
pkcs8 = { version = "0.10", features = ["pem", "std"] }
rand = "0.8"
tokio = { version = "1", features = ["macros", "rt"] }

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sevenz-rust = "0.6.1"
sha2 = "0.10"
tauri = { version = "2", features = ["custom-protocol"] }
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
